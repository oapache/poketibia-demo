<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>PokeTibia — teste de combate</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; color: #eee; font: 13px monospace; width: 100%; height: 100%; }
  #c { display: block; image-rendering: pixelated; background: #000; position: fixed; top: 0; left: 0; }

  /* painel modular (arrastavel) - base reusavel pra minimapa, inventario etc */
  .panel {
    position: fixed;
    background: #1a1a1ae6;
    border: 2px solid #444;
    border-radius: 6px;
    z-index: 20;
    user-select: none;
    box-shadow: 0 2px 8px #0008;
  }
  .panel-title {
    background: #2a2a2a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-bottom: 1px solid #444;
    cursor: grab;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 4px 4px 0 0;
  }
  .panel-title:active { cursor: grabbing; }
  .panel-body { padding: 4px; }
  .panel.minimized .panel-body { display: none; }

  /* grupo fixo: painel grudado a outros, nao arrasta individualmente (usa
     dentro de .panel-stack em vez de solto na tela) */
  .panel.fixed-in-stack { position: static; border-radius: 0; box-shadow: none; }
  .panel.fixed-in-stack .panel-title { cursor: default; }
  .panel-stack {
    position: fixed;
    display: flex; flex-direction: column;
    border: 2px solid #444; border-radius: 6px; overflow: hidden;
    z-index: 20; box-shadow: 0 2px 8px #0008;
  }
  .panel-stack .panel.fixed-in-stack + .panel.fixed-in-stack { border-top: 1px solid #444; }
  .panel-btn {
    background: #3a3a3a;
    border: 1px solid #555;
    color: #eee;
    font: bold 11px monospace;
    width: 18px; height: 18px;
    line-height: 16px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    border-radius: 3px;
  }
  .panel-btn:hover { background: #4a4a4a; }

  /* ---- portado de landing-page/src/features/fidelize/FidelizePanel.css ----
     (o usuario ja tinha esse design pronto/aprovado - trocamos o que
     tinhamos feito do zero por isso, so adaptado pra DOM puro em vez de
     React e sprites locais em vez de PokeAPI) */
  #party-box {
    --fz-panel: #130b1c;
    --fz-line: #402a52;
    --fz-cyan: #b35bff;
    --fz-text: #e6dcf0;
    --fz-muted: #9c8caa;
    --fz-green: #24d678;
    position: relative;
    width: 234px;
    overflow: hidden;
    border: 1px solid #442b56;
    border-radius: 8px;
    background-color: var(--fz-panel);
    background-image:
      linear-gradient(rgba(70, 40, 95, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 40, 95, 0.08) 1px, transparent 1px),
      linear-gradient(135deg, rgba(65, 35, 90, 0.13) 25%, transparent 25%, transparent 50%, rgba(65, 35, 90, 0.13) 50%, rgba(65, 35, 90, 0.13) 75%, transparent 75%);
    background-size: 8px 8px, 8px 8px, 10px 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.9), 0 16px 45px rgba(0,0,0,.58), inset 0 0 24px rgba(6,1,10,.72);
    font-family: Tahoma, Verdana, sans-serif;
    color: var(--fz-text);
  }
  #party-box::before, #party-box::after {
    position: absolute; z-index: 4; width: 15px; height: 15px; content: ''; pointer-events: none;
  }
  #party-box::before { top: 4px; left: 4px; border-top: 1px solid #7238a0; border-left: 1px solid #7238a0; border-radius: 4px 0 0; }
  #party-box::after { right: 4px; bottom: 4px; border-right: 1px solid #7238a0; border-bottom: 1px solid #7238a0; border-radius: 0 0 4px; }

  .fz-player-card, .fz-pokemon-card {
    display: grid; grid-template-columns: 54px minmax(0,1fr);
    align-items: center; gap: 8px; padding: 9px 9px 8px;
  }
  .fz-player-card { border-bottom: 1px solid var(--fz-line); }
  .fz-pokemon-card { border-bottom: 1px solid rgba(70,40,95,.5); }
  .fz-portrait, .fz-pokemon-portrait {
    display: grid; place-items: center; overflow: hidden; border-radius: 50%;
    background: radial-gradient(circle at 44% 42%, #3a2450, #0d0716 66%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.75);
  }
  .fz-portrait { width: 49px; height: 49px; border: 1px solid var(--fz-cyan); box-shadow: 0 0 0 2px rgba(40,15,55,.8), inset 0 0 0 1px rgba(0,0,0,.72); }
  .fz-pokemon-portrait { width: 43px; height: 43px; margin-left: 5px; border: 1px solid #3f2a50; box-shadow: inset 0 0 0 1px rgba(20,10,28,.75), 0 0 13px rgba(178,85,255,.08); }
  .fz-player-name { display: block; margin-bottom: 2px; color: #ece0f5; font-size: 12px; font-weight: 800; letter-spacing: .08em; line-height: 1; }
  .fz-player-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--fz-muted); font-size: 9px; line-height: 1; }
  .fz-level-badge { display: inline-flex; align-items: center; height: 16px; overflow: hidden; border: 1px solid #7a34ab; border-radius: 3px; background: #240f30; color: #f3e4ff; font-size: 10px; line-height: 1; }
  .fz-level-badge b { padding: 2px 4px; color: var(--fz-cyan); font-weight: 800; }
  .fz-level-badge span { padding: 2px 4px 2px 1px; }
  .fz-stat-line { display: flex; align-items: baseline; justify-content: space-between; min-width: 0; margin-bottom: 3px; color: var(--fz-cyan); font-size: 10px; line-height: 1; }
  .fz-stat-line b { color: var(--fz-text); font-size: 10px; font-weight: 700; }
  .fz-progress { display: block; height: 7px; overflow: hidden; border: 1px solid #291a38; border-radius: 5px; background: #0c0710; box-shadow: inset 0 0 4px rgba(0,0,0,.9); }
  .fz-progress > span { display: block; height: 100%; min-width: 0; border-radius: inherit; background: var(--fz-cyan); box-shadow: 0 0 8px rgba(179,91,255,.3); transition: width 180ms ease; }
  .fz-progress-hp > span { background: var(--fz-green); box-shadow: 0 0 8px rgba(36,214,120,.26); }
  .fz-pokemon-title { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 4px; line-height: 1; }
  .fz-pokemon-title strong { overflow: hidden; color: #ece0ee; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
  .fz-pokemon-title span { flex: 0 0 auto; color: #a292ac; font-size: 9px; }
  .fz-hp-line { margin-bottom: 4px; }
  .fz-hp-line b { color: #ddd0e0; }
  .fz-hp-line i { color: #73607e; font-size: 9px; font-style: normal; }
  .fz-xp-line { margin-top: 6px; margin-bottom: 3px; }

  .fz-party { display: grid; grid-template-columns: repeat(6, 1fr); align-items: center; gap: 3px; padding: 6px 8px 7px; }
  .fz-party-slot, .fz-party-empty { position: relative; display: grid; width: 32px; height: 33px; place-items: center; justify-self: center; border-radius: 5px; }
  .fz-party-slot { padding: 0; border: 1px solid transparent; background: rgba(14,1,19,.42); cursor: pointer; transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease; }
  .fz-party-slot:hover { transform: translateY(-1px); border-color: #8f4fc0; background: rgba(90,35,120,.25); }
  .fz-party-slot.active { border-color: var(--fz-cyan); background: #33124a; box-shadow: inset 0 0 0 1px rgba(200,130,255,.14), 0 0 9px rgba(179,91,255,.12); }
  .fz-party-slot > span { position: absolute; right: 2px; bottom: 1px; color: #d8e6e9; font-size: 8px; font-weight: 800; line-height: 1; text-shadow: 0 1px 2px #000; }
  .fz-party-empty { border: 1px dashed rgba(70,40,90,.48); background: rgba(12,5,17,.25); }
  .fz-sprite { display: block; max-width: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 2px 2px rgba(0,0,0,.65)); }
  .fz-pokemon-portrait .fz-sprite { width: 38px; height: 38px; }
  .fz-portrait .fz-sprite { width: 42px; height: 42px; }
  .fz-party-slot .fz-sprite { width: 28px; height: 28px; }

  /* treinador em CSS puro (sem sprite de jogo) - resolve de vez o problema
     do outfit 159 so ter pose de "arremessar pokebola" em toda direcao,
     que ficava parecendo "voando" num retrato estatico pequeno */
  .fz-trainer { position: relative; display: block; width: 31px; height: 38px; transform: translateY(2px); image-rendering: pixelated; }
  .fz-trainer span { position: absolute; display: block; }
  .fz-trainer-cap { top: 2px; left: 7px; width: 19px; height: 6px; background: #de3d4a; box-shadow: -3px 3px 0 #8e2038, 5px 4px 0 #a72337, 12px 5px 0 #741a31; }
  .fz-trainer-hair { top: 8px; left: 7px; width: 18px; height: 11px; background: #3a1e2d; box-shadow: -3px 3px 0 #251822, 15px 3px 0 #251822, 4px 9px 0 #251822; }
  .fz-trainer-face { top: 10px; left: 10px; width: 13px; height: 11px; background: #ffb483; box-shadow: 3px 4px 0 #df815f, 8px 8px 0 #bd604e; }
  .fz-trainer-shirt { top: 21px; left: 7px; width: 20px; height: 12px; background: #e8edf1; box-shadow: -4px 3px 0 #bad2da, 17px 2px 0 #cae1e5, 3px 9px 0 #3174a2, 10px 9px 0 #2b5d95; }
  .fz-trainer-shadow { top: 33px; left: 4px; width: 25px; height: 3px; background: rgba(0,0,0,.52); box-shadow: -3px 2px 0 rgba(0,0,0,.35), 5px 2px 0 rgba(0,0,0,.35); }
  .party-icon img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }

  .item-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .item-slot {
    position: relative; width: 34px; height: 34px;
    background: #111; border: 1px solid #444; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .item-slot img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }
  .item-count {
    position: absolute; bottom: 1px; right: 2px;
    font-size: 9px; font-weight: bold; color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<button id="settings-gear" title="Configuracoes" style="position:fixed; bottom:12px; right:12px; width:34px; height:34px; border-radius:50%; background:#2a2a2ae6; border:2px solid #555; color:#eee; font-size:16px; cursor:pointer; z-index:21;">⚙</button>

<div class="panel" id="panel-settings" style="bottom:54px; right:12px; width:260px; display:none;">
  <div class="panel-title" data-drag-handle>
    <span>Configuracoes</span>
    <button class="panel-btn" id="settings-close" title="Fechar">x</button>
  </div>
  <div class="panel-body">
    <div style="font-size:11px; font-weight:bold; margin-bottom:4px;">Zoom da camera</div>
    <div id="zoom-presets" style="display:flex; gap:4px;"></div>
  </div>
</div>

<!-- grupo fixo (nao arrasta, nao separa) - minimapa+mochila+pokebag grudados -->
<div class="panel-stack" style="top:12px; right:12px; width:180px;">
  <div class="panel fixed-in-stack" id="panel-minimap">
    <div class="panel-title">
      <span>Minimapa</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body">
      <canvas id="minimap-canvas" width="168" height="168" style="display:block; image-rendering: pixelated;"></canvas>
    </div>
  </div>
  <div class="panel fixed-in-stack" id="panel-mochila">
    <div class="panel-title">
      <span>Mochila</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body item-grid" id="mochila-grid"></div>
  </div>
  <div class="panel fixed-in-stack" id="panel-pokebag">
    <div class="panel-title">
      <span>PokeBag</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body item-grid" id="pokebag-grid"></div>
  </div>
</div>

<div id="panel-party" style="position:fixed; top:12px; left:12px; width:200px; background:transparent; border:none; box-shadow:none;">
  <div class="panel-body" id="party-list"></div>
</div>

<script src="battle.js"></script>
</body>
</html>
