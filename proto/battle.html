<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>PokeTibia — teste de combate</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; color: #eee; font: 13px monospace; width: 100%; height: 100%; }
  #c { display: block; image-rendering: pixelated; background: #000; position: fixed; top: 0; left: 0; }

  /* painel modular (arrastavel) - base reusavel pra minimapa, inventario etc */
  .panel {
    position: fixed;
    background: #1a1a1ae6;
    border: 2px solid #444;
    border-radius: 6px;
    z-index: 20;
    user-select: none;
    box-shadow: 0 2px 8px #0008;
  }
  .panel-title {
    background: #2a2a2a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-bottom: 1px solid #444;
    cursor: grab;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 4px 4px 0 0;
  }
  .panel-title:active { cursor: grabbing; }
  .panel-body { padding: 4px; }
  .panel.minimized .panel-body { display: none; }

  /* grupo fixo: painel grudado a outros, nao arrasta individualmente (usa
     dentro de .panel-stack em vez de solto na tela) */
  .panel.fixed-in-stack { position: static; border-radius: 0; box-shadow: none; }
  .panel.fixed-in-stack .panel-title { cursor: default; }
  .panel-stack {
    position: fixed;
    display: flex; flex-direction: column;
    border: 2px solid #444; border-radius: 6px; overflow: hidden;
    z-index: 20; box-shadow: 0 2px 8px #0008;
  }
  .panel-stack .panel.fixed-in-stack + .panel.fixed-in-stack { border-top: 1px solid #444; }
  .panel-btn {
    background: #3a3a3a;
    border: 1px solid #555;
    color: #eee;
    font: bold 11px monospace;
    width: 18px; height: 18px;
    line-height: 16px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    border-radius: 3px;
  }
  .panel-btn:hover { background: #4a4a4a; }

  /* cartao do treinador / Pokemon ativo - tema azul unico, escala de raio
     unica (10px cartao / 8px icone / 50% retrato), sem glow neon (isso e
     "AI tell" - troquei por highlight interno sutil, mais discreto) */
  .trainer-card, .active-card {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, #1d2c40, #141f2f);
    border: 1px solid #2f4a6b;
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: inset 0 1px 0 #ffffff14;
  }
  .active-card { margin-top: 6px; }
  .card-portrait {
    width: 42px; height: 42px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #16273b, #0a1420);
    border: 2px solid #3ea6ff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
    box-shadow: inset 0 1px 2px #ffffff2e, inset 0 -2px 4px #00000066;
  }
  .card-portrait img { width: 34px; height: 34px; object-fit: contain; image-rendering: pixelated; }
  .card-info { flex: 1; min-width: 0; }
  .card-name-row { display: flex; align-items: center; gap: 6px; }
  .card-name { font-size: 12px; font-weight: 700; color: #eaf4ff; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-badge {
    font-size: 9px; font-weight: 700; color: #06121f;
    background: #3ea6ff; border-radius: 4px; padding: 2px 5px;
    letter-spacing: .3px;
  }
  .card-sub { font-size: 9px; color: #6f92b8; margin-top: 2px; }
  .card-hpbar { height: 6px; background: #1a0e0e; border-radius: 4px; overflow: hidden; margin-top: 5px; box-shadow: inset 0 1px 2px #00000066; }
  .card-hpbar-fill { height: 100%; border-radius: 4px; background: linear-gradient(180deg, #5eeb85, #2fb855); transition: width .3s ease; }
  .card-hp-text { font-size: 9px; color: #a9c4de; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card-xpbar { height: 3px; background: #0c1622; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .card-xpbar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3ea6ff, #6fc4ff); }
  .card-xp-text { font-size: 8px; color: #4c8ec2; margin-top: 2px; letter-spacing: .3px; }

  .party-switcher { display: flex; gap: 6px; margin-top: 8px; }
  .party-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: #141f2f; border: 2px solid #2f4a6b;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .party-icon:hover { border-color: #5fb8ff; transform: translateY(-1px); }
  .party-icon:active { transform: translateY(0) scale(.96); }
  .party-icon.active { border-color: #3ea6ff; background: #1c3450; box-shadow: inset 0 1px 0 #ffffff2e; }
  .party-icon img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }

  .item-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .item-slot {
    position: relative; width: 34px; height: 34px;
    background: #111; border: 1px solid #444; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .item-slot img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }
  .item-count {
    position: absolute; bottom: 1px; right: 2px;
    font-size: 9px; font-weight: bold; color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<button id="settings-gear" title="Configuracoes" style="position:fixed; bottom:12px; right:12px; width:34px; height:34px; border-radius:50%; background:#2a2a2ae6; border:2px solid #555; color:#eee; font-size:16px; cursor:pointer; z-index:21;">⚙</button>

<div class="panel" id="panel-settings" style="bottom:54px; right:12px; width:260px; display:none;">
  <div class="panel-title" data-drag-handle>
    <span>Configuracoes</span>
    <button class="panel-btn" id="settings-close" title="Fechar">x</button>
  </div>
  <div class="panel-body">
    <div style="font-size:11px; font-weight:bold; margin-bottom:4px;">Zoom da camera</div>
    <div id="zoom-presets" style="display:flex; gap:4px;"></div>
  </div>
</div>

<!-- grupo fixo (nao arrasta, nao separa) - minimapa+mochila+pokebag grudados -->
<div class="panel-stack" style="top:12px; right:12px; width:180px;">
  <div class="panel fixed-in-stack" id="panel-minimap">
    <div class="panel-title">
      <span>Minimapa</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body">
      <canvas id="minimap-canvas" width="168" height="168" style="display:block; image-rendering: pixelated;"></canvas>
    </div>
  </div>
  <div class="panel fixed-in-stack" id="panel-mochila">
    <div class="panel-title">
      <span>Mochila</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body item-grid" id="mochila-grid"></div>
  </div>
  <div class="panel fixed-in-stack" id="panel-pokebag">
    <div class="panel-title">
      <span>PokeBag</span>
      <button class="panel-btn" data-minimize-btn title="Minimizar">-</button>
    </div>
    <div class="panel-body item-grid" id="pokebag-grid"></div>
  </div>
</div>

<div class="panel fixed-in-stack" id="panel-party" style="position:fixed; top:12px; left:12px; width:200px; border-radius:6px;">
  <div class="panel-body" id="party-list"></div>
</div>

<script src="battle.js"></script>
</body>
</html>
